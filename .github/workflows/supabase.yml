name: Publicar Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: softpet-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: xhjeutrxmvplkasdxmcx
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar a CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular o projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Publicar Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
